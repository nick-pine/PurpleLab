[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "purplelab"
version = "0.1.0"
description = "A local adversary-emulation and detection-validation platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
purplelab = "purplelab.cli:app"

[tool.setuptools.packages.find]
include = ["purplelab*"]
exclude = ["tests*"]
